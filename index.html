<style>
        body {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            background-color: theme('colors.background');
        }
        
        .paper-card {
            background-color: #FEFEF8;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .paper-card:hover {
            transform: translateY(-5px) rotate(0deg) !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            z-index: 10;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .paper-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: theme('spacing.card-padding');
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #FEFEF8;
            justify-content: flex-start;
        }

        .polaroid {
            background: white;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
    </style>

<body class="text-on-background min-h-screen flex flex-col relative overflow-x-hidden" style="overflow: hidden;">
<!-- Intro Overlay -->
<div id="intro-overlay" class="fixed inset-0 z-[100] bg-background flex flex-col items-center justify-center text-center p-4">
    <!-- State 1: Initial Question -->
    <div id="intro-question" class="flex flex-col items-center">
        <h2 class="font-display-name text-4xl text-primary mb-8">Did you enjoy your birthday Enrico?</h2>
        <div class="flex gap-4">
            <button id="btn-no" class="px-8 py-3 bg-red-500 text-white rounded-full font-bold text-xl hover:bg-red-600 transition shadow-lg">No</button>
            <button id="btn-yes" class="px-8 py-3 bg-green-500 text-white rounded-full font-bold text-xl hover:bg-green-600 transition shadow-lg">Yes</button>
        </div>
    </div>
    
    <!-- State 2: Mad Bunny (Yes clicked) -->
    <div id="intro-mad" class="hidden flex flex-col items-center">
        <img src="angry-bunny.gif" alt="Mad Bunny" class="w-64 h-64 object-cover rounded-lg mb-6 shadow-xl">
        <h2 class="font-display-name text-3xl text-error mb-6">ur supposed to press no 😡</h2>
        <button id="btn-try-again" class="px-8 py-3 bg-secondary text-white rounded-full font-bold text-xl hover:bg-secondary-fixed-variant transition shadow-lg">Try again</button>
    </div>

    <!-- State 3: Loading (No clicked) -->
    <div id="intro-loading" class="hidden flex flex-col items-center">
        <img src="https://media1.tenor.com/m/0UjJci2WK40AAAAC/bunny-rabbit.gif" alt="Running Bunny" class="w-48 h-48 object-contain mb-6">
        <h2 class="font-display-name text-3xl text-primary animate-pulse">Making birthday enjoyable...</h2>
    </div>
</div>
<!-- TopAppBar -->
<header class="w-full top-0 px-margin-desktop bg-background dark:bg-background flex flex-col md:flex-row items-center justify-between max-w-full mx-auto relative z-50 py-12 gap-6">
    <!-- Left images -->
    <div class="flex gap-4 md:gap-8 items-center justify-center z-10">
        <div class="w-32 h-32 md:w-48 md:h-48 overflow-hidden rounded-xl shadow-xl transform -rotate-6 hover:scale-105 hover:-rotate-2 transition duration-300 flex-shrink-0 border-4 border-white">
            <img src="Messenger_creation_1EBCC5AD-9F6E-48F5-AD12-3A459A87D01C.jpeg" alt="Enrico Pic Left 1" class="w-full h-full object-cover">
        </div>
        <div class="w-32 h-32 md:w-48 md:h-48 overflow-hidden rounded-xl shadow-xl transform rotate-2 hover:scale-105 hover:rotate-4 transition duration-300 flex-shrink-0 border-4 border-white hidden md:block">
            <img src="Messenger_creation_7897ED03-8CB7-409E-AB7C-17E2616E7B20.jpeg" alt="Enrico Pic Left 2" class="w-full h-full object-cover">
        </div>
    </div>
    
    <h1 class="font-display-name text-display-name text-primary dark:text-primary-fixed-dim text-center flex-grow z-20">Happy Birthday Enrico!!!</h1>
    
    <!-- Right images -->
    <div class="flex gap-4 md:gap-8 items-center justify-center z-10">
        <div class="w-32 h-32 md:w-48 md:h-48 overflow-hidden rounded-xl shadow-xl transform -rotate-2 hover:scale-105 hover:rotate-1 transition duration-300 flex-shrink-0 border-4 border-white hidden md:block">
            <img src="Messenger_creation_C4A6EF50-D8F3-45BF-81E4-E4E95B12E032.jpeg" alt="Enrico Pic Right 1" class="w-full h-full object-cover">
        </div>
        <div class="w-32 h-32 md:w-48 md:h-48 overflow-hidden rounded-xl shadow-xl transform rotate-6 hover:scale-105 hover:rotate-2 transition duration-300 flex-shrink-0 border-4 border-white">
            <img src="Messenger_creation_54EA1643-8B57-459C-A626-1983A76871F6.jpeg" alt="Enrico Pic Right 2" class="w-full h-full object-cover">
        </div>
    </div>
</header>
<!-- Main Content: Scattered Cards Grid -->
<main class="flex-grow px-margin-mobile md:px-margin-desktop py-12 relative z-10 max-w-7xl mx-auto w-full">
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 auto-rows-[300px]">
<!-- Enrico Video 1 -->
<div class="polaroid cursor-pointer w-full h-full flex flex-col items-center justify-center relative transition-transform duration-300 hover:scale-[1.02]" style="transform: rotate(-1.5deg); z-index: 5;">
    <div class="w-full flex-1 min-h-0 mb-2 rounded-sm relative bg-black flex items-center justify-center pb-4">
        <video class="w-full h-full object-contain" src="vid1.mp4" controls playsinline preload="metadata"></video>
    </div>
</div>
<!-- Enrico Video 2 -->
<div class="polaroid cursor-pointer w-full h-full flex flex-col items-center justify-center relative transition-transform duration-300 hover:scale-[1.02]" style="transform: rotate(1.2deg); z-index: 5;">
    <div class="w-full flex-1 min-h-0 mb-2 rounded-sm relative bg-black flex items-center justify-center pb-4">
        <video class="w-full h-full object-contain" src="vid2.mp4" controls playsinline preload="metadata"></video>
    </div>
</div>
<!-- Enrico Video 3 -->
<div class="polaroid cursor-pointer w-full h-full flex flex-col items-center justify-center relative transition-transform duration-300 hover:scale-[1.02]" style="transform: rotate(-0.8deg); z-index: 5;">
    <div class="w-full flex-1 min-h-0 mb-2 rounded-sm relative bg-black flex items-center justify-center pb-4">
        <video class="w-full h-full object-contain" src="vid3.mp4" controls playsinline preload="metadata"></video>
    </div>
</div>
<!-- Enrico Video 4 -->
<div class="polaroid cursor-pointer w-full h-full flex flex-col items-center justify-center relative transition-transform duration-300 hover:scale-[1.02]" style="transform: rotate(2deg); z-index: 5;">
    <div class="w-full flex-1 min-h-0 mb-2 rounded-sm relative bg-black flex items-center justify-center pb-4">
        <video class="w-full h-full object-contain" src="vid4.mp4" controls playsinline preload="metadata"></video>
    </div>
</div>
<!-- Enrico Video 5 -->
<div class="polaroid cursor-pointer w-full h-full flex flex-col items-center justify-center relative transition-transform duration-300 hover:scale-[1.02]" style="transform: rotate(-2deg); z-index: 5;">
    <div class="w-full flex-1 min-h-0 mb-2 rounded-sm relative bg-black flex items-center justify-center pb-4">
        <video class="w-full h-full object-contain" src="vid5.mp4" controls playsinline preload="metadata"></video>
    </div>
</div>
<!-- Enrico Video 6 -->
<div class="polaroid cursor-pointer w-full h-full flex flex-col items-center justify-center relative transition-transform duration-300 hover:scale-[1.02]" style="transform: rotate(1.5deg); z-index: 5;">
    <div class="w-full flex-1 min-h-0 mb-2 rounded-sm relative bg-black flex items-center justify-center pb-4">
        <video class="w-full h-full object-contain" src="vid6.mp4" controls playsinline preload="metadata"></video>
    </div>
</div>
<!-- Image Card (Left) -->
<div class="polaroid cursor-pointer w-full h-full flex flex-col items-center justify-center relative transition-transform duration-300 hover:scale-[1.02]" style="transform: rotate(-2.5deg); z-index: 5;">
    <div class="w-full h-full mb-2 overflow-hidden bg-surface-container-high rounded-sm relative">
        <img class="w-full h-full object-cover" src="Messenger_creation_E32ED990-8A60-449E-A47E-EB466CDFEBC2.jpeg" alt="Enrico Pic">
    </div>
</div>
<!-- Card 12 (Decorative) -->
<div class="paper-card cursor-pointer w-full h-full" onclick="this.classList.toggle('flipped')" style="transform: rotate(-0.5deg);">
<div class="card-inner">
<div class="card-front">
<span class="material-symbols-outlined text-secondary text-6xl mb-4" style="font-variation-settings: 'FILL' 1;">cake</span>
</div>
<div class="card-back overflow-y-auto custom-scrollbar" style="justify-content: center; text-align: center;">
<p class="font-display-name text-3xl text-on-surface">Happy Birthday!<br>🎂✨</p>
</div>
</div>
</div>
<!-- Video Card (Right) -->
<div class="polaroid cursor-pointer w-full h-full flex flex-col items-center justify-center relative transition-transform duration-300 hover:scale-[1.02]" style="transform: rotate(2deg); z-index: 5;">
    <div class="w-full flex-1 min-h-0 mb-2 rounded-sm relative bg-black flex items-center justify-center pb-4">
        <video class="w-full h-full object-contain" src="Messenger_creation_27F166B7-43A1-4E78-8471-2E205F25F9FF.mp4" controls="" autoplay="" muted="" loop="" playsinline=""></video>
    </div>
</div>
</div>
</main>

<!-- Footer -->

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const overlay = document.getElementById("intro-overlay");
        const questionDiv = document.getElementById("intro-question");
        const madDiv = document.getElementById("intro-mad");
        const loadingDiv = document.getElementById("intro-loading");
        
        const btnYes = document.getElementById("btn-yes");
        const btnNo = document.getElementById("btn-no");
        const btnTryAgain = document.getElementById("btn-try-again");

        document.body.style.overflow = "hidden";

        btnYes.addEventListener("click", () => {
            questionDiv.classList.add("hidden");
            madDiv.classList.remove("hidden");
        });

        btnTryAgain.addEventListener("click", () => {
            madDiv.classList.add("hidden");
            questionDiv.classList.remove("hidden");
        });

        btnNo.addEventListener("click", () => {
            questionDiv.classList.add("hidden");
            loadingDiv.classList.remove("hidden");
            
            setTimeout(() => {
                overlay.style.transition = "opacity 0.5s ease";
                overlay.style.opacity = "0";
                setTimeout(() => {
                    overlay.classList.add("hidden");
                    window.scrollTo(0, 0);
                    document.body.style.overflow = "";
                }, 500);
            }, 2500);
        });
    });
</script>
</body></html>
